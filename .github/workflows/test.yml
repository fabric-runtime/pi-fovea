name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    # Independent, opt-in audit of the stronger abstract Lean development.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-lean
      - run: bun install --frozen-lockfile
      - name: Full Lean kernel check and axiom audit
        run: bun run check:lean
      - name: Positive and broken-proof gate fixtures
        run: bunx vitest run tests/lean-proofs.test.ts
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The affected-test selection diffs the push range or the pull-request
          # base, so that base commit has to be present in history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: ast-grep
        run: npm i -g @ast-grep/cli@0.45.3
      - run: bun install --frozen-lockfile
      - name: Laws, executable artifact, and proof bridge boundaries
        run: |
          bun run check:proofs
          bunx vitest run tests/proofs.test.ts tests/verified-kernels.test.ts
      - name: Type check
        run: bun run typecheck
      - name: Readable authored source
        run: bun run format:check
      - name: Affected tests
        env:
          # Pull requests compare against the target branch; pushes compare
          # against the tip they replaced. An unusable base selects nothing.
          PI_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run test:affected
      - name: Pipeline smoke floor
        # Curated scan-to-render floor (about three seconds) so a push the
        # selection did not cover still exercises the pipeline.
        run: bun run test:smoke
      - name: Dead code
        run: bun run lint:dead
      - name: Isolated published packages (CLI, generated kernels, proof receipts)
        run: |
          bun run check:package
          bun run check:package:cli
